<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Portfolio HOFFMANN Alann - Technicien Système & Réseaux (BTS SIO SISR)">
<meta name="author" content="HOFFMANN Alann">
<meta property="og:type" content="website">
<meta property="og:title" content="Portfolio Alann HOFFMANN | BTS SIO SISR">
<meta property="og:description" content="Technicien Système & Réseaux. Découvrez mes projets Infrastructure, Windows Server, Linux et automatisation.">
<meta property="og:url" content="https://alannhoffmann86.github.io/portfolio-alann-hoffmann/">
<meta name="twitter:card" content="summary">
<title>Portfolio de Alann HOFFMANN | SISR</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%2300b4d8%22>_&gt;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --accent:#00b4d8; --accent2:#0077a8; --orange:#f77f00; --green:#10b981;
  --glass:rgba(20,26,40,.75); --glass-light:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.12); --text:#f1f5f9; --muted:#94a3b8;
  --win-bg:#141a26; --win-bar:#1c2433; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--text);background:#0b101e;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent)}

/* ---------- Fond d'écran ---------- */
#wallpaper{position:fixed;inset:0;transition:background 1s}
.wp-0{background:radial-gradient(ellipse at 25% 75%,#0369a1 0%,transparent 55%),radial-gradient(ellipse at 80% 25%,#1e3a8a 0%,transparent 50%),radial-gradient(ellipse at 70% 90%,#0e7490 0%,transparent 40%),#0b101e}
.wp-1{background:radial-gradient(ellipse at 30% 30%,#7c2d12 0%,transparent 55%),radial-gradient(ellipse at 75% 80%,#c2410c 0%,transparent 45%),#0f0a08}
.wp-2{background:radial-gradient(ellipse at 20% 30%,#065f46 0%,transparent 55%),radial-gradient(ellipse at 80% 80%,#0f766e 0%,transparent 50%),#04140f}
.wp-3{background:#0b101e;background-image:linear-gradient(rgba(0,180,216,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,180,216,.06) 1px,transparent 1px);background-size:40px 40px}
#net{position:fixed;inset:0;opacity:.55;pointer-events:none}

/* ---------- Écran de verrouillage ---------- */
#lock{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:11vh 20px 9vh;background:radial-gradient(ellipse at 25% 75%,#0369a1 0%,transparent 55%),radial-gradient(ellipse at 80% 25%,#1e3a8a 0%,transparent 50%),#0b101e;transition:transform .7s cubic-bezier(.7,0,.3,1),opacity .7s;cursor:pointer}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
#lock .time{font-size:clamp(64px,12vw,128px);font-weight:600;letter-spacing:-2px;text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.4)}
#lock .date{font-size:clamp(16px,2.4vw,24px);text-align:center;opacity:.9}
#lock .login{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1e3a8a);display:grid;place-items:center;font-size:36px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.4);flex-shrink:0}
#lock .name{font-size:24px;font-weight:700}
.typer{font-family:"Fira Code",monospace;font-size:14px;color:var(--accent);min-height:20px}
.typer::after{content:"▌";color:var(--orange);animation:blink .8s step-end infinite}
@keyframes blink{50%{opacity:0}}
#lock .hint{font-size:13px;opacity:.7;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
#loginBtn{padding:9px 28px;border-radius:6px;background:rgba(255,255,255,.15);border:1px solid var(--border);backdrop-filter:blur(10px)}
#loginBtn:hover{background:rgba(255,255,255,.25)}

/* ---------- Bureau ---------- */
#desktop{position:fixed;inset:0 0 52px 0;padding:12px 10px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,98px);grid-auto-columns:90px;gap:4px;align-content:start}
.icon{width:86px;height:94px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;border-radius:6px;border:1px solid transparent;text-align:center;font-size:12px;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.icon:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.12)}
.icon.sel{background:rgba(0,180,216,.25);border-color:rgba(0,180,216,.5)}
.icon svg{width:46px;height:46px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}

/* ---------- Fenêtres ---------- */
.win{position:absolute;min-width:340px;min-height:220px;background:var(--win-bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;resize:both;animation:open .18s ease-out}
@keyframes open{from{transform:scale(.94);opacity:0}}
.win.closing{animation:close .15s ease-in forwards}
@keyframes close{to{transform:scale(.94);opacity:0}}
.win.min{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 52px)!important;border-radius:0;resize:none}
.win.inactive .bar{background:#171d29;color:var(--muted)}
.bar{height:38px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding-left:12px;background:var(--win-bar);font-size:13px;cursor:default;touch-action:none}
.bar svg{width:18px;height:18px}
.bar .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{width:46px;height:38px;display:grid;place-items:center}
.ctrl:hover{background:rgba(255,255,255,.1)}
.ctrl.x:hover{background:#c42b1c}
.ctrl svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.2}
.content{flex:1;overflow:auto;padding:22px 26px;user-select:text;font-size:14px;line-height:1.6}
.content::-webkit-scrollbar,.ex-main::-webkit-scrollbar,.chat-body::-webkit-scrollbar{width:10px}
.content::-webkit-scrollbar-thumb,.ex-main::-webkit-scrollbar-thumb,.chat-body::-webkit-scrollbar-thumb{background:#3a4456;border-radius:5px;border:3px solid var(--win-bg)}
.content h1{font-size:25px;margin-bottom:4px}
.content h2{font-size:16px;margin:22px 0 10px;color:var(--accent);display:flex;align-items:center;gap:8px}
.content h2:first-child{margin-top:0}
.content h3{font-size:15px}
.content p{margin-bottom:10px;color:#d6dde7}
.content ul{margin:0 0 10px 20px;color:#d6dde7}
.content li{margin-bottom:3px}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:3px 10px;margin:3px 4px 3px 0;border-radius:20px;background:rgba(0,180,216,.12);border:1px solid rgba(0,180,216,.3);font-size:12px;color:#b9ecf7}
.tag.g{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.35);color:#b8f5dc}
.tag.o{background:rgba(247,127,0,.12);border-color:rgba(247,127,0,.35);color:#fed7aa}
.card{background:var(--glass-light);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.card h3{margin-bottom:4px}
.card.hl{border-color:rgba(0,180,216,.5);background:rgba(0,180,216,.06);position:relative}
.badge{position:absolute;top:-10px;right:14px;background:var(--accent);color:#000;font-size:11px;font-weight:700;padding:2px 9px;border-radius:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:5px;background:var(--accent2);color:#fff;text-decoration:none;font-size:13px;margin:4px 6px 4px 0;cursor:pointer}
.btn:hover{background:#0891b2}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--border)}
.btn.ghost:hover{background:rgba(255,255,255,.15)}
.btn.off{opacity:.5;cursor:not-allowed;background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.hero{display:flex;gap:20px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:20px;background:rgba(16,185,129,.12);color:#86efac;margin-top:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 2s infinite}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.tick{color:#22c55e;font-weight:700;margin-right:4px}
.lvl{display:flex;gap:4px;height:8px;margin:5px 0 12px}
.lvl i{flex:1;border-radius:2px;background:#243044}
.lvl i.on{background:var(--accent);box-shadow:0 0 6px rgba(0,180,216,.4)}
.lvl-row{display:flex;justify-content:space-between;font-size:13px;color:#d6dde7}
.timeline{border-left:2px solid rgba(0,180,216,.35);margin-left:8px;padding-left:24px}
.tl{position:relative;margin-bottom:24px}
.tl::before{content:"";position:absolute;left:-31px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--win-bg);border:2px solid var(--orange)}
.tl .d{font-family:"Fira Code",monospace;color:var(--accent);font-size:12.5px}
.tl .pl{color:var(--muted);font-style:italic;font-size:13px;margin-bottom:4px}
.mono{font-family:"Fira Code",monospace}

/* Explorateur */
.explorer{display:flex;height:calc(100% + 44px);margin:-22px -26px}
.ex-side{width:190px;flex-shrink:0;background:#111621;border-right:1px solid var(--border);padding:12px 8px;font-size:13px;overflow:auto}
.ex-side div{padding:6px 10px;border-radius:5px;display:flex;gap:8px;align-items:center;cursor:pointer}
.ex-side div:hover,.ex-side div.on{background:rgba(255,255,255,.08)}
.ex-side hr{border:0;border-top:1px solid var(--border);margin:8px 4px}
.ex-main{flex:1;overflow:auto;padding:16px 22px}
.ex-path{font-size:12px;color:var(--muted);padding:6px 10px;background:#0f141e;border:1px solid var(--border);border-radius:5px;margin-bottom:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ex-path span{cursor:pointer}.ex-path span:hover{color:#fff}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.file{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:6px;text-align:center;font-size:12.5px;cursor:pointer;border:1px solid transparent;word-break:break-word}
.file:hover{background:rgba(255,255,255,.06);border-color:var(--border)}
.file svg{width:52px;height:52px}
.file small{color:var(--muted);font-size:11px}

/* Terminal */
.term{background:#070a10;margin:-22px -26px;height:calc(100% + 44px);padding:14px 16px;font-family:"Fira Code",Consolas,monospace;font-size:13px;line-height:1.55;color:#cbd5e1;overflow:auto}
.term .l{white-space:pre-wrap;word-break:break-word}
.term .p{color:var(--green)}.term .c{color:var(--accent)}.term .ok{color:#22c55e}.term .err{color:#f87171}.term .y{color:var(--orange)}
.term-in{display:flex;gap:8px}.term-in input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;caret-color:var(--accent)}

/* Chat */
.chat{display:flex;flex-direction:column;height:calc(100% + 44px);margin:-22px -26px}
.chat-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:9px 13px;border-radius:12px;line-height:1.45;font-size:13.5px;animation:open .2s}
.msg.bot{align-self:flex-start;background:#1f2a3c;border-bottom-left-radius:3px}
.msg.me{align-self:flex-end;background:var(--accent2);border-bottom-right-radius:3px}
.msg ul{margin:4px 0 0 18px}
.chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:#0f141e}
.chat-in input{flex:1;background:#1a2130;border:1px solid var(--border);border-radius:20px;padding:9px 14px;color:#fff;font:inherit;font-size:13px;outline:0}
.chat-in input:focus{border-color:var(--accent)}
.chat-in button{width:38px;height:38px;border-radius:50%;background:var(--accent2);display:grid;place-items:center}
.chat-in button:disabled,.chat-in input:disabled{opacity:.5}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.sugg button{font-size:12px;padding:5px 11px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.04)}
.sugg button:hover{border-color:var(--accent)}

/* Veille */
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;margin:8px 0 12px}
.pipe span.s{border:1px solid rgba(0,180,216,.35);padding:3px 9px;border-radius:4px;background:rgba(0,180,216,.06)}
.pipe span.a{color:var(--orange)}
.vnote{font-size:12.5px;color:var(--muted);border-left:3px solid var(--orange);padding:8px 12px;margin-bottom:16px;background:rgba(247,127,0,.05);border-radius:0 5px 5px 0}
.vday{background:var(--glass-light);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin-bottom:12px}
.vday-d{color:var(--accent);font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.ventry{padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.ventry:last-child{border-bottom:0}
.vsrc{color:var(--orange);font-size:11.5px;font-family:"Fira Code",monospace}
.vtitle{display:block;color:var(--text);font-weight:600;text-decoration:none;margin:2px 0}
a.vtitle:hover{color:var(--accent)}
.vres{color:var(--muted);font-size:13px}
.vsources{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:6px}
.vsources a{display:block;padding:10px 12px;border-radius:6px;border:1px solid var(--border);background:var(--glass-light);text-decoration:none;color:var(--text);font-size:13px;font-weight:600}
.vsources a small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.vsources a:hover{border-color:var(--accent)}

/* Barre des tâches */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:52px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;z-index:5000}
#tb-apps{display:flex;gap:4px;align-items:center}
.tb{width:44px;height:44px;border-radius:6px;display:grid;place-items:center;position:relative;transition:background .15s}
.tb:hover{background:rgba(255,255,255,.08)}
.tb svg{width:26px;height:26px}
.tb.open::after{content:"";position:absolute;bottom:3px;width:6px;height:3px;border-radius:2px;background:#9aa0a6;transition:width .2s}
.tb.active{background:rgba(255,255,255,.08)}
.tb.active::after{width:16px;background:var(--accent)}
.tb .tip{position:absolute;bottom:54px;white-space:nowrap;background:#1c2433;border:1px solid var(--border);padding:4px 10px;font-size:12px;border-radius:5px;opacity:0;pointer-events:none;transition:opacity .15s}
.tb:hover .tip{opacity:1;transition-delay:.4s}
#tray{position:absolute;right:8px;display:flex;align-items:center;gap:4px;font-size:12px}
#tray .t{padding:6px 10px;border-radius:6px;display:flex;align-items:center;gap:8px}
#tray .t:hover{background:rgba(255,255,255,.08)}
#tray svg{width:16px;height:16px}
#clock{text-align:right;line-height:1.35}

/* Menu Démarrer */
#start{position:fixed;bottom:62px;left:50%;width:min(640px,96vw);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:rgba(24,30,44,.92);backdrop-filter:blur(40px) saturate(1.5);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:6000;transition:transform .2s,opacity .2s;overflow:hidden}
#start.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#start .search{margin:22px 28px 6px;display:flex;align-items:center;gap:10px;background:#111621;border:1px solid var(--border);border-bottom:2px solid var(--accent);border-radius:6px;padding:8px 12px}
#start .search input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:13px}
#start h4{font-size:13px;font-weight:600;margin:16px 34px 8px}
#pinned{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px;padding:0 24px 18px;min-height:190px;max-height:52vh;overflow:auto;align-content:start}
.pin{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:6px;font-size:12px;text-align:center}
.pin:hover{background:rgba(255,255,255,.08)}
.pin svg{width:34px;height:34px}
#start .foot{display:flex;justify-content:space-between;align-items:center;padding:12px 30px;background:rgba(0,0,0,.25);border-top:1px solid var(--border)}
#start .me{display:flex;align-items:center;gap:10px;font-size:13px}
#start .me .avatar{width:32px;height:32px;font-size:13px}
#power{width:36px;height:36px;border-radius:6px;display:grid;place-items:center}
#power:hover{background:rgba(255,255,255,.1)}

/* Menu contextuel + notif */
#ctx{position:fixed;z-index:7000;min-width:220px;background:rgba(28,36,51,.96);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:8px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;font-size:13px}
#ctx div{padding:7px 14px;border-radius:4px;cursor:default}
#ctx div:hover{background:rgba(255,255,255,.08)}
#ctx hr{border:0;border-top:1px solid var(--border);margin:4px 0}
#toast{position:fixed;right:14px;bottom:66px;width:340px;max-width:calc(100vw - 28px);background:rgba(28,36,51,.96);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:8px;padding:14px 16px;z-index:6500;transform:translateX(120%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{transform:none}
#toast .tt{display:block;font-weight:700;margin-bottom:3px}

#shutdown{position:fixed;inset:0;background:#000;z-index:9500;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:18px;text-align:center;padding:20px}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Lecteur PDF */
.pdfv{display:flex;flex-direction:column;height:calc(100% + 44px);margin:-22px -26px}
.pdf-tb{display:flex;align-items:center;gap:3px;padding:6px 10px;background:#1c2433;border-bottom:1px solid var(--border);flex-wrap:wrap;font-size:12.5px;user-select:none}
.pdf-tb button,.pdf-tb a{height:30px;min-width:30px;padding:0 9px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:#fff;text-decoration:none;cursor:pointer}
.pdf-tb button:hover,.pdf-tb a:hover{background:rgba(255,255,255,.1)}
.pdf-tb button:disabled{opacity:.35;cursor:default;background:none}
.pdf-tb .sep{width:1px;height:20px;background:var(--border);margin:0 5px}
.pdf-tb input{width:42px;height:26px;background:#0f141e;border:1px solid var(--border);color:#fff;border-radius:4px;text-align:center;font:inherit}
.pdf-tb .zl{min-width:46px;text-align:center;color:var(--muted)}
.pdf-tb .grow{flex:1}
.pdf-tb .pr{background:var(--accent2)}.pdf-tb .pr:hover{background:#0891b2}
.pdf-pages{flex:1;overflow:auto;background:#252c39;padding:16px;position:relative;display:flex;flex-direction:column}
.pdf-pages canvas{display:block;margin:0 auto 14px;box-shadow:0 4px 18px rgba(0,0,0,.5);background:#fff;flex-shrink:0}
.pdf-msg{color:var(--muted);text-align:center;margin:auto;padding:30px;display:flex;flex-direction:column;align-items:center;gap:14px}
#printArea{display:none}
@media print{
  body.printing{height:auto!important;overflow:visible!important;background:#fff!important}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block!important}
  #printArea img{display:block;width:100%;break-after:page;page-break-after:always}
  #printArea img:last-child{break-after:auto;page-break-after:auto}
  @page{margin:0}
}
@media (max-width:700px){.pdf-tb .zl,.pdf-tb .fitlbl{display:none}}
.net-svg{width:100%;max-width:640px;display:block;margin:6px auto 14px}

@media (max-width:700px){

function initChat(w){
  const body=w.querySelector(".chat-body"),inp=w.querySelector(".chat-in input"),btn=w.querySelector(".chat-in button"),sugg=w.querySelector(".sugg");let busy=false;
  const add=(cls,html,isText)=>{const m=document.createElement("div");m.className="msg "+cls;if(isText)m.textContent=html;else m.innerHTML=html;body.appendChild(m);body.scrollTop=body.scrollHeight;return m;};

function initVeille(w){
  const note=w.querySelector("#vnote"),liste=w.querySelector(".vlist");
  const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!==undefined)e.textContent=txt;return e;};
  const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const texte=(v,m)=>String(v==null?"":v).slice(0,m);
  const lienSur=u=>{try{const x=new URL(u);return(x.protocol==="https:"||x.protocol==="http:")?x.href:null;}catch(e){return null;}};
  const dateLongue=iso=>{const p=iso.split("-");return new Date(+p[0],+p[1]-1,+p[2],12).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});};
  const charger=j=>fetch(VEILLE_DOSSIER+"/"+j+".json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null)
    .then(d=>d&&typeof d.date==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d.date)&&Array.isArray(d.articles)?d:null);
  const carte=j=>{const c=el("article","vday");c.appendChild(el("div","vday-d",dateLongue(j.date)));
    j.articles.slice(0,30).forEach(a=>{const l=el("div","ventry");l.appendChild(el("span","vsrc","["+texte(a.source,60)+"]"));
      const titre=texte(a.titre,200)||texte(a.resume,80),href=lienSur(a.lien);let t;
      if(href){t=el("a","vtitle",titre);t.href=href;t.target="_blank";t.rel="noopener noreferrer";}else t=el("span","vtitle",titre);
      l.appendChild(t);l.appendChild(el("span","vres",texte(a.resume,400)));c.appendChild(l);});return c;};
  const now=new Date(),jours=[];
  for(let i=-1;i<VEILLE_JOURS_RECHERCHE-1;i++)jours.push(ymd(new Date(now.getFullYear(),now.getMonth(),now.getDate()-i,12)));
  Promise.all(jours.map(charger)).then(res=>{
    const ok=res.filter(Boolean).sort((a,b)=>a.date<b.date?1:-1);
    if(!ok.length){note.textContent="Aucune publication disponible pour le moment. Les résumés apparaissent ici chaque jour.";return;}
    const m=texte(ok[0].modele,40);
    note.textContent="Résumés générés automatiquement par une IA exécutée en local"+(m?" ("+m+")":"")+" à partir de flux RSS. Ils peuvent comporter des erreurs : consulter les sources. Dernière mise à jour : "+dateLongue(ok[0].date)+".";
    ok.forEach((j,i)=>{const c=carte(j);if(i>=VEILLE_JOURS_VISIBLES)c.hidden=true;liste.appendChild(c);});
    if(ok.length>VEILLE_JOURS_VISIBLES){const b=el("button","btn ghost","Afficher les jours précédents");b.onclick=()=>{liste.querySelectorAll(".vday[hidden]").forEach(c=>c.hidden=false);b.remove();};liste.after(b);}
  });
}

/* ===================== LECTEUR PDF (pdf.js) ===================== */
let pdfjsReady=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  if(pdfjsReady)return pdfjsReady;
  pdfjsReady=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src=PDFJS+"pdf.min.js";
    sc.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";res();};
    sc.onerror=()=>{pdfjsReady=null;rej(new Error("pdf.js"));};document.head.appendChild(sc);});
  return pdfjsReady;
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-pdf]");if(!t)return;e.preventDefault();openPdf(t.dataset.pdf,t.dataset.ttl||t.dataset.pdf);});
function openPdf(file,title){
  const w=openApp("pdf");if(!w)return;
  const url=doc(file);
  w.querySelector(".title").textContent=title+" — Lecteur PDF";
  const tb=w.querySelector(".pdf-tb");
  tb.querySelector('[data-a="tab"]').href=url;
  const dl=tb.querySelector('[data-a="dl"]');dl.href=url;dl.setAttribute("download",file);
  pdfLoad(w,url,title);
  return w;
}
async function pdfLoad(w,url,title){
  const pages=w.querySelector(".pdf-pages"),tok=++w._tok;
  w._pdf=null;w._title=title;w.querySelector(".tot").textContent="–";pdfUi(w);
  pages.innerHTML='<div class="pdf-msg"><div class="spinner"></div>Chargement du document…</div>';
  try{
    await loadPdfJs();
    const pdf=await pdfjsLib.getDocument(url).promise;
    if(tok!==w._tok)return;
    w._pdf=pdf;w._page=1;
    w.querySelector(".tot").textContent=pdf.numPages;
    await pdfFit(w);
  }catch(err){
    if(tok!==w._tok)return;
    pages.innerHTML=`<div class="pdf-msg">⚠️ Impossible d'afficher ce document ici.<span style="font-size:12px">Vérifie que le fichier est bien dans le dossier <b>documents/</b>.</span><a class="btn" href="${url}" target="_blank" rel="noopener noreferrer">↗ Ouvrir dans un nouvel onglet</a></div>`;
  }
}
async function pdfFit(w){
  if(!w._pdf)return;const pages=w.querySelector(".pdf-pages");
  const p1=await w._pdf.getPage(1),vp=p1.getViewport({scale:1});
  w._scale=Math.max(.4,Math.min(2.5,(pages.clientWidth-40)/vp.width));
  await pdfRender(w);
}
async function pdfRender(w){
  const pdf=w._pdf;if(!pdf)return;
  const pages=w.querySelector(".pdf-pages"),rt=++w._rtok,dpr=Math.min(2,window.devicePixelRatio||1);
  const keep=w._page||1;pages.innerHTML="";const list=[];
  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i);if(rt!==w._rtok)return;
    const vp=pg.getViewport({scale:w._scale}),c=document.createElement("canvas");
    c.width=Math.floor(vp.width*dpr);c.height=Math.floor(vp.height*dpr);c.style.width=Math.floor(vp.width)+"px";c.style.height=Math.floor(vp.height)+"px";
    c.dataset.page=i;pages.appendChild(c);list.push([pg,vp,c]);
  }
  pdfUi(w);pdfGoto(w,keep,true);
  for(const [pg,vp,c] of list){
    if(rt!==w._rtok)return;
    await pg.render({canvasContext:c.getContext("2d"),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;
  }
}
function pdfGoto(w,n,instant){
  if(!w._pdf)return;n=Math.max(1,Math.min(w._pdf.numPages,n|0||1));
  const pages=w.querySelector(".pdf-pages"),c=pages.querySelector(`canvas[data-page="${n}"]`);
  if(c)pages.scrollTo({top:c.offsetTop-16,behavior:instant?"auto":"smooth"});
  w._page=n;pdfUi(w);
}
function pdfUi(w){
  const tb=w.querySelector(".pdf-tb"),has=!!w._pdf;
  tb.querySelector('[data-a="page"]').value=has?w._page:"–";
  tb.querySelector(".zl").textContent=has?Math.round(w._scale*100)+" %":"–";
  tb.querySelectorAll("button").forEach(b=>b.disabled=!has);
  if(has){tb.querySelector('[data-a="prev"]').disabled=w._page<=1;tb.querySelector('[data-a="next"]').disabled=w._page>=w._pdf.numPages;}
}
async function pdfPrint(w){
  if(!w||!w._pdf)return;
  const area=$("#printArea");area.innerHTML="";
  toast("🖨️ Préparation de l'impression…",`${w._title} · ${w._pdf.numPages} page(s)`);
  try{
    for(let i=1;i<=w._pdf.numPages;i++){
      const pg=await w._pdf.getPage(i),vp=pg.getViewport({scale:2}),c=document.createElement("canvas");
      c.width=vp.width;c.height=vp.height;
      await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      const img=new Image();img.src=c.toDataURL("image/jpeg",.92);await img.decode().catch(()=>{});area.appendChild(img);
    }
    document.body.classList.add("printing");
    const done=()=>{document.body.classList.remove("printing");area.innerHTML="";removeEventListener("afterprint",done);};
    addEventListener("afterprint",done);
    setTimeout(()=>{try{window.print();}catch(e){done();toast("⚠️ Impression bloquée","Utilise ⬇️ Télécharger ou ↗ Nouvel onglet pour imprimer.");}},50);
  }catch(e){document.body.classList.remove("printing");area.innerHTML="";toast("⚠️ Impression impossible","Utilise ↗ Nouvel onglet pour imprimer ce document.");}
}
function initPdfViewer(w){
  w._tok=0;w._rtok=0;w._scale=1;w._page=1;
  const tb=w.querySelector(".pdf-tb"),pages=w.querySelector(".pdf-pages"),inp=tb.querySelector('[data-a="page"]');
  tb.addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b||!w._pdf)return;
    const a=b.dataset.a;
    if(a==="prev")pdfGoto(w,w._page-1);
    if(a==="next")pdfGoto(w,w._page+1);
    if(a==="zin"){w._scale=Math.min(4,w._scale*1.2);pdfRender(w);}
    if(a==="zout"){w._scale=Math.max(.3,w._scale/1.2);pdfRender(w);}
    if(a==="fit")pdfFit(w);
    if(a==="print")pdfPrint(w);
  });
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")pdfGoto(w,parseInt(inp.value,10));});
  let st;pages.addEventListener("scroll",()=>{clearTimeout(st);st=setTimeout(()=>{if(!w._pdf)return;
    const mid=pages.scrollTop+pages.clientHeight/3;let cur=1;
    pages.querySelectorAll("canvas").forEach(c=>{if(c.offsetTop<=mid)cur=+c.dataset.page;});
    if(cur!==w._page){w._page=cur;pdfUi(w);}},80);});
  pdfUi(w);
}
// Ctrl+P quand le lecteur PDF est au premier plan = imprime le document, pas le bureau
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="p"){const w=opened.pdf;
    if(w&&!w.classList.contains("min")&&!w.classList.contains("inactive")&&w._pdf){e.preventDefault();pdfPrint(w);}}
});

/* ===================== ANIMATION RÉSEAU (fond) ===================== */
(function(){
  const cv=$("#net"),cx=cv.getContext("2d");let P=[];
  const rs=()=>{cv.width=innerWidth;cv.height=innerHeight;P=[];const n=Math.min(90,(cv.width*cv.height)/18000);
    for(let i=0;i<n;i++)P.push({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.8+.8});};
  const loop=()=>{if(netOn){cx.clearRect(0,0,cv.width,cv.height);
    for(let i=0;i<P.length;i++){const p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>cv.width)p.vx*=-1;if(p.y<0||p.y>cv.height)p.vy*=-1;
      cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fillStyle="#00b4d8";cx.fill();
      for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<120){cx.beginPath();cx.strokeStyle=`rgba(0,180,216,${(1-d/120)*.8})`;cx.lineWidth=.5;cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke();}}}}
    requestAnimationFrame(loop);};
  addEventListener("resize",rs);rs();loop();
})();

function typer(el){if(!el)return;let r=0,c=0,del=false;(function t(){if(!el.isConnected)return;const s=ROLES[r];c+=del?-1:1;el.textContent=s.slice(0,c);
  let sp=del?40:80;if(!del&&c===s.length){sp=2000;del=true;}else if(del&&c===0){del=false;r=(r+1)%ROLES.length;sp=500;}setTimeout(t,sp);})();}
function toast(t,m){const e=$("#toast");e.innerHTML=`<span class="tt">${t}</span>${m}`;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),4500);}
function copyMail(b){try{navigator.clipboard.writeText(ME.email).then(()=>b.textContent="✅ Copié !",()=>b.textContent=ME.email);}catch(e){b.textContent=ME.email;}}
function tick(){const d=new Date();
  $("#clock").innerHTML=`${d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}<br>${d.toLocaleDateString("fr-FR")}`;
  $("#lockTime").textContent=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  const s=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});$("#lockDate").textContent=s[0].toUpperCase()+s.slice(1);}
let unlocked=false;
function unlock(){if(unlocked)return;unlocked=true;$("#lock").classList.add("gone");
  setTimeout(()=>{toast("👋 Bienvenue sur mon portfolio","Double-clique sur une icône, ouvre le Terminal (<b>help</b>) ou pose une question à l'Assistant IA.");if(innerWidth>700&&!location.hash)openApp("about");},700);}
$("#lock").onclick=unlock;
document.addEventListener("keydown",e=>{if(!unlocked&&(e.key==="Enter"||e.key===" "))unlock();if(e.key==="Escape")closeStart();});

typer($("#typer1"));renderDesktop();renderTaskbar();renderPinned();tick();setInterval(tick,15000);

if(location.hash&&APPS[location.hash.slice(1)]){unlock();setTimeout(()=>openApp(location.hash.slice(1)),750);}
